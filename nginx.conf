# /etc/nginx/conf.d/zombie-lan.conf
#
# 用途：把公网 80/443 反代到本地 8123 的 relay.cjs。
# relay.cjs 在同一端口既服务静态页面又收 WebSocket，所以 location / 同时处理
# 普通请求与 WS 升级（Connection "upgrade" 那条必须有）。
#
# 前置：relay.cjs 已在 127.0.0.1:8123 跑着（node /opt/zombie-lan/relay.cjs 或 systemd/docker）。
# 申请免费证书：sudo certbot --nginx -d game.example.com
#   certbot 会自动把下面 80 段升级成 443 + 加证书。手动版见底部注释。

server {
    listen 80;
    server_name game.example.com;   # 改成你的域名

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级（关键）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

